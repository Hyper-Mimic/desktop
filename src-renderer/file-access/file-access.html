<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: var(--hm-window-text, black);
        background-color: var(--hm-window-bg, white);
        accent-color: var(--hm-window-accent, #ff4c4c);
      }
      main {
        padding: 1rem;
        box-sizing: border-box;
        width: 100%;
        min-height: 100vh;
        border: 20px solid var(--hm-window-accent, #ff4c4c);
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      h1, p, ul {
        margin: 0;
      }
      .file-path, .command {
        font-family: monospace;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .command::before {
        content: '$ ';
      }
            /* Title-bar space is opt-in: only a window whose OS title bar was actually hidden gets
         the 32px. The theme script adds html.hm-custom-titlebar in that case; a native title
         bar must not leave a duplicate gap (which also produced a page-level scrollbar).
         Scrolling lives inside <main>, so the scrollbar never runs through the title bar. */
      :root { --hm-titlebar-height: 0px; --hm-window-titlebar: #4c97ff; --hm-window-titlebar-text: #fff; }
      html.hm-custom-titlebar { --hm-titlebar-height: 32px; }
      #hm-window-titlebar { display: none; position: fixed; top: 0; left: 0; right: 0; height: var(--hm-titlebar-height);
        box-sizing: border-box; align-items: center; padding: 0 12px; padding-right: 150px;
        overflow: hidden; white-space: nowrap; font: 12px "Helvetica Neue", Helvetica, Arial, sans-serif;
        background-color: var(--hm-window-titlebar); color: var(--hm-window-titlebar-text);
        -webkit-app-region: drag; user-select: none; z-index: 2147483647; }
      html.hm-custom-titlebar #hm-window-titlebar { display: flex; }
      /* body is the one scroll container and starts BELOW the fixed title bar (margin, not
         padding), so its scrollbar never runs through the title bar. main -- border included --
         scrolls with the content inside it, as one block. */
      html { height: 100%; overflow: hidden; }
      body { margin-top: var(--hm-titlebar-height) !important;
        height: calc(100vh - var(--hm-titlebar-height)) !important;
        overflow-y: auto !important; overflow-x: hidden !important; box-sizing: border-box; }
      /* Content shorter than the viewport has no scrollbar; longer content scrolls the whole
         block below the title bar, border included. */
      main { height: auto !important;
        min-height: calc(100vh - var(--hm-titlebar-height)) !important; box-sizing: border-box; }
      #app [class*="settings_container"] {
        top: var(--hm-titlebar-height) !important;
        height: calc(100% - var(--hm-titlebar-height)) !important;
      }
    </style>
  </head>
  <body>
    <div id="hm-window-titlebar"></div>
    <main>
      <script>
        // This file only does anything on Linux, so we don't need to worry about Windows paths.

        // It's not the end of the world if this is imperfect as we won't automatically run the command,
        // just show it to the user. The things we're escaping are file paths so it's quite unlikely that
        // there would be any shell code in there unless the system is already compromised.
        const escapeForShellSingleQuotes = (string) => string.replace(/'/g, `'"'"'`);

        const makeNode = () => ({
          leaf: false,
          children: Object.create(null)
        });
        const root = makeNode();

        const addPathToGraph = (path) => {
          const parts = path.split('/');
          let node = root;

          // Paths always start with / and the last part is the filename, so ignore first and last item.
          for (let i = 1; i < parts.length - 1; i++) {
            const name = parts[i];
            if (!Object.prototype.hasOwnProperty.call(node.children, name)) {
              node.children[name] = makeNode();
            }
            node = node.children[name];
          }

          node.leaf = true;
        };
        
        const getOverridePaths = () => {
          const recurse = (path, node) => {
            if (node.leaf) {
              // Ignore children.
              return [path];
            }

            const result = [];
            for (const childName of Object.keys(node.children)) {
              const childPath = `${path}${childName}/`;
              const childLeaves = recurse(childPath, node.children[childName]);
              for (const leaf of childLeaves) {
                result.push(leaf);
              }
            }
            return result;
          };

          return recurse('/', root);
        };

        const addPath = (path) => {
          const pathElement = document.createElement('li');
          pathElement.className = 'file-path';
          pathElement.textContent = path;
          fileListElement.appendChild(pathElement);

          addPathToGraph(path);
          const overrides = getOverridePaths().map(i => {
            // --filesystem=/ isn't valid, need to use --filesystem=host instead
            const value = i === '/' ? 'host' : i;
            // The \ need to be escaped for flatpak to handle them properly
            const escaped = escapeForShellSingleQuotes(value.replace(/\\/g, '\\\\'));
            return `--filesystem='${escaped}'`;
          });

          // Escaping FLATPAK_ID is not necessary. Just being extra safe.
          const command = `flatpak override '${escapeForShellSingleQuotes(FLATPAK_ID)}' --user ${overrides.join(' ')}`;
          commandElement.textContent = command;
        };

        FileAccessPreload.onNewPath(addPath);

        const {locale, strings, APP_NAME, FLATPAK_ID, initialPaths} = FileAccessPreload.init();
        document.documentElement.lang = locale;
      </script>

      <p class="introduction"></p>
      <script>
        document.querySelector('.introduction').textContent = strings['file-access.flatpak'].replace('{APP_NAME}', APP_NAME);
      </script>

      <ul class="file-list"></ul>

      <p class="how-to-fix"></p>
      <script>
        document.querySelector('.how-to-fix').textContent = strings['file-access.how-to-fix'];
      </script>

      <p class="command"></p>

      <script>
        const fileListElement = document.querySelector('.file-list');
        const commandElement = document.querySelector('.command');
        for (const path of initialPaths) {
          addPath(path);
        }
      </script>
    </main>
  </body>
</html>
