<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: var(--hm-window-text, black);
        background-color: var(--hm-window-bg, white);
      }
      body {
        padding: 0;
        margin: 0;
      }

      main {
        padding: 0.75rem 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      p {
        margin: 0;
      }

      .buttons {
        display: flex;
        gap: 0.5rem;
      }
      .buttons button {
        flex-grow: 1;
        font: inherit;
        font-weight: bold;
        padding: 0.75rem 1rem;
        border-radius: 0.25rem;
        border: rgba(0, 0, 0, 0.15);
        cursor: pointer;
      }
      .deny {
        background-color: rgb(255, 92, 92);
        color: white;
      }
      .allow {
        background-color: #24cd11;
        color: black;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background-color: #111;
          color: #eee;
        }
        .buttons button {
          border-color: rgba(255, 255, 255, 0.15);
        }
      }
            /* Title-bar space is opt-in: only a window whose OS title bar was actually hidden gets
         the 32px. The theme script adds html.hm-custom-titlebar in that case; a native title
         bar must not leave a duplicate gap (which also produced a page-level scrollbar).
         Scrolling lives inside <main>, so the scrollbar never runs through the title bar. */
      :root { --hm-titlebar-height: 0px; --hm-window-titlebar: #4c97ff; --hm-window-titlebar-text: #fff; }
      html.hm-custom-titlebar { --hm-titlebar-height: 32px; }
      #hm-window-titlebar { display: none; position: fixed; top: 0; left: 0; right: 0; height: var(--hm-titlebar-height);
        box-sizing: border-box; align-items: center; padding: 0 12px; padding-right: 150px;
        overflow: hidden; white-space: nowrap; font: 12px "Helvetica Neue", Helvetica, Arial, sans-serif;
        background-color: var(--hm-window-titlebar); color: var(--hm-window-titlebar-text);
        -webkit-app-region: drag; user-select: none; z-index: 2147483647; }
      html.hm-custom-titlebar #hm-window-titlebar { display: flex; }
      /* body is the one scroll container and starts BELOW the fixed title bar (margin, not
         padding), so its scrollbar never runs through the title bar. main -- border included --
         scrolls with the content inside it, as one block. */
      html { height: 100%; overflow: hidden; }
      body { margin-top: var(--hm-titlebar-height) !important;
        height: calc(100vh - var(--hm-titlebar-height)) !important;
        overflow-y: auto !important; overflow-x: hidden !important; box-sizing: border-box; }
      /* Content shorter than the viewport has no scrollbar; longer content scrolls the whole
         block below the title bar, border included. */
      main { height: auto !important;
        min-height: calc(100vh - var(--hm-titlebar-height)) !important; box-sizing: border-box; }
      #app [class*="settings_container"] {
        top: var(--hm-titlebar-height) !important;
        height: calc(100% - var(--hm-titlebar-height)) !important;
      }
    </style>
  </head>

  <body>
    <div id="hm-window-titlebar"></div>
    <main>
      <p data-type="read-clipboard" data-l10n="security-prompt.read-clipboard1"></p>
      <p data-type="read-clipboard" data-l10n="security-prompt.read-clipboard2"></p>
      <p data-type="read-clipboard" data-l10n="security-prompt.read-clipboard3"></p>

      <p data-type="notifications" data-l10n="security-prompt.notifications1"></p>
      <p data-type="notifications" data-l10n="security-prompt.notifications2"></p>

      <div class="buttons">
        <button class="deny" disabled data-l10n="security-prompt.deny"></button>
        <button class="allow" disabled data-l10n="security-prompt.allow"></button>
      </div>
    </main>

    <script>
      const {APP_NAME, locale, strings, type} = SecurityPromptPreload.init();
      document.documentElement.lang = locale;

      for (const el of document.querySelectorAll('[data-l10n]')) {
        const stringName = el.getAttribute('data-l10n');
        el.textContent = (strings[stringName] || `Missing string: ${stringName}`).replace('{APP_NAME}', APP_NAME);
      }
      for (const el of document.querySelectorAll('[data-type]')) {
        if (el.getAttribute('data-type') !== type) {
          el.style.display = 'none';
        }
      }
 
      const allowButton = document.querySelector('.allow');
      allowButton.addEventListener('click', () => {
        SecurityPromptPreload.allow();
      });

      const denyButton = document.querySelector('.deny');
      denyButton.addEventListener('click', () => {
        SecurityPromptPreload.deny();
      });

      // Delay to prevent clickjacking
      setTimeout(() => {
        denyButton.disabled = false;
        allowButton.disabled = false;
      }, 500);

      SecurityPromptPreload.ready({
        height: document.body.clientHeight
      });
    </script>
  </body>
</html>
