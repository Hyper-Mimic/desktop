name: Manual Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mac
          - windows
          - linux
      signing:
        description: 'Enable code signing (macOS only)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
  # macOS 签名环境变量（仅在 signing 为 true 时使用）
  CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
  CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Fetch assets
        run: yarn run fetch

      - name: Compile (webpack:prod)
        run: yarn run webpack:prod

      - name: Package
        run: |
          if [ "${{ github.event.inputs.platform }}" == "all" ]; then
            npx electron-builder --mac --windows --linux --publish=never
          else
            npx electron-builder --${{ github.event.inputs.platform }} --publish=never
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manual-build
          path: dist/
          retention-days: 7

  # macOS 签名构建（独立任务，在 macOS runner 上执行）
  package-mac-signed:
    runs-on: macos-latest
    if: github.event.inputs.signing == 'true' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'mac')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Fetch assets
        run: yarn run fetch

      - name: Compile (webpack:prod)
        run: yarn run webpack:prod

      - name: Import Apple Developer Certificate
        if: env.CSC_LINK != '' && env.CSC_KEY_PASSWORD != ''
        run: |
          echo "Importing Apple Developer Certificate..."
          echo $CSC_LINK | base64 --decode > certificate.p12
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          security import certificate.p12 -k build.keychain -P $CSC_KEY_PASSWORD -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temp build.keychain
          security default-keychain -s build.keychain
          rm -f certificate.p12

      - name: Package for macOS (Signed)
        run: |
          npx electron-builder --mac --universal --publish=never

      - name: Notarize macOS app
        if: env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: |
          echo "Notarizing macOS app..."
          APP_PATH=$(find dist -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            ditto -c -k --keepParent "$APP_PATH" "dist/app.zip"
            xcrun notarytool submit "dist/app.zip" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$APP_PATH"
          else
            echo "⚠️ No .app file found, skipping notarization"
          fi

      - name: Upload signed macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-signed-universal
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 7