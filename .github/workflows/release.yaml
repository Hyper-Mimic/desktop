name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
  # macOS 签名环境变量
  CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
  CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  CSC_FOR_PULL_REQUEST: false

jobs:
  # ==========================================
  # 1. 统一构建阶段
  # ==========================================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Fetch assets
        run: yarn run fetch

      - name: Compile (webpack:prod)
        run: yarn run webpack:prod

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist-renderer-webpack/
            dist-library-files/
            dist-extensions/
            src-renderer/packager/
          retention-days: 1

  # ==========================================
  # 2. macOS 打包（带签名）
  # ==========================================
  package-mac:
    needs: build
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: universal
            args: '--mac --universal'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Import Apple Developer Certificate
        if: env.CSC_LINK != '' && env.CSC_KEY_PASSWORD != ''
        run: |
          echo "Importing Apple Developer Certificate..."
          echo $CSC_LINK | base64 --decode > certificate.p12
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          security import certificate.p12 -k build.keychain -P $CSC_KEY_PASSWORD -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temp build.keychain
          security default-keychain -s build.keychain
          rm -f certificate.p12

      - name: Package for macOS (Signed)
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$CSC_KEY_PASSWORD" ]; then
            echo "Building with code signing..."
            npx electron-builder --mac --universal --publish=never
          else
            echo "⚠️ No certificate found, building unsigned..."
            npx electron-builder --mac --universal --publish=never --config.mac.gatekeeperAssess=false
          fi

      - name: Notarize macOS app
        if: env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: |
          echo "Notarizing macOS app..."
          # 找到生成的 .app 文件
          APP_PATH=$(find dist -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            # 打包为 zip 用于公证
            ditto -c -k --keepParent "$APP_PATH" "dist/app.zip"
            
            # 提交公证
            xcrun notarytool submit "dist/app.zip" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            
            # 公证成功后 stapling
            xcrun stapler staple "$APP_PATH"
          else
            echo "⚠️ No .app file found, skipping notarization"
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-universal
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 1

  # ==========================================
  # 3. Windows 打包
  # ==========================================
  package-windows:
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: nsis-x64
            args: '--windows --x64'
            files: '*.exe'
          - target: portable-x64
            args: '--windows-portable --x64'
            files: '*.exe'
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Package for Windows
        run: |
          npx electron-builder ${{ matrix.args }} --publish=never

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: dist/${{ matrix.files }}
          retention-days: 1

  # ==========================================
  # 4. Linux 打包
  # ==========================================
  package-linux:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        format: [deb, appimage, tar.gz]
        arch: [x64, arm64, armv7l]
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install yarn
        run: npm install -g yarn

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Package for Linux
        run: |
          npx electron-builder --linux --${{ matrix.arch }} --${{ matrix.format }} --publish=never

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.format }}-${{ matrix.arch }}
          path: |
            dist/*.${{ matrix.format }}
            dist/*.tar.gz
            dist/*.AppImage
          retention-days: 1

  # ==========================================
  # 5. 发布到 GitHub Releases
  # ==========================================
  publish:
    needs: [package-mac, package-windows, package-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}