name: Release

on:
  workflow_dispatch:  # ← 改为手动触发
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string
        default: 'v1.0.0'
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - mac
          - windows

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-latest
    # 如果 platform 不是 all 或 linux，跳过这个 job
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux'
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        persist-credentials: false
    - name: Install strip-nondeterminism
      run: sudo apt-get install strip-nondeterminism
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install dependencies
      run: yarn install --frozen-lockfile --loglevel=info
    - name: Fetch
      run: yarn run fetch
    - name: Compile
      run: yarn run webpack:prod
    - name: Package
      run: |
        node release-automation/build.mjs --debian --tarball --appimage --x64 --armv7l --arm64 --production
    - name: Print file tree
      run: node scripts/print-file-tree.mjs dist
    - name: Upload artifacts to GitHub Actions
      uses: actions/upload-artifact@v4
      with:
        name: linux
        path: |
          dist/*.deb
          dist/*.tar.gz
          dist/*.AppImage
        retention-days: 1

  release-mac:
    runs-on: macos-latest
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'mac'
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        persist-credentials: false
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install dependencies
      run: yarn install --loglevel=info
    - name: Fetch
      run: yarn run fetch
    - name: Compile
      run: yarn run webpack:prod
    - name: Package
      run: |
        python3 -c "import os; open('authkey.p8', 'w').write(os.getenv('APPLE_API_KEY_DATA'))" >/dev/null 2>&1
        export APPLE_API_KEY="$(pwd)/authkey.p8"
        node release-automation/build.mjs --mac --universal --production
        node release-automation/build.mjs --mac-legacy-11 --universal --production
        node release-automation/build.mjs --mac-legacy-10.13-10.14 --mac-legacy-10.15 --x64 --production
        rm authkey.p8
      env:
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        APPLE_API_KEY_DATA: ${{ secrets.APPLE_API_KEY_DATA }}
        # CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
        # CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
        CSC_IDENTITY_AUTO_DISCOVERY: false
    - name: Print file tree
      run: node scripts/print-file-tree.mjs dist
    - name: Upload artifacts to GitHub Actions
      uses: actions/upload-artifact@v4
      with:
        name: mac
        path: dist/*.dmg
        retention-days: 1

  release-windows:
    runs-on: windows-latest
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows'
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        persist-credentials: false
        path: repo
    - name: "Move repository to D: drive"
      run: |
        Copy-Item -Path repo -Destination D:\repo -Recurse
        Remove-Item -Path repo -Recurse -Force
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: "Configure yarn to use D: drive"
      run: |
        yarn config set cache-folder D:\yarn-cache
    - name: Install dependencies
      working-directory: D:\repo
      run: yarn install --loglevel=info
    - name: Fetch
      working-directory: D:\repo
      run: yarn run fetch
    - name: Compile
      working-directory: D:\repo
      run: yarn run webpack:prod
    - name: Package
      working-directory: D:\repo
      run: |
        node release-automation/build.mjs --windows --microsoft-store --x64 --ia32 --arm64 --production
        node release-automation/build.mjs --windows-portable --x64 --production
        node release-automation/build.mjs --windows-legacy --ia32 --x64 --production
    - name: Print file tree
      working-directory: D:\repo
      run: node scripts/print-file-tree.mjs dist
    - name: Upload artifacts to GitHub Actions
      uses: actions/upload-artifact@v4
      with:
        name: windows
        path: |
          D:\repo\dist\*.exe
          D:\repo\dist\*.appx
        retention-days: 1

  # ==========================================
  # 上传到 GitHub Releases
  # ==========================================
  upload-release:
    needs: [release-linux, release-mac, release-windows]
    runs-on: ubuntu-latest
    # 只有当至少一个平台成功时才运行
    if: always() && !cancelled()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          ls -la artifacts/

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          draft: false
          prerelease: false
          files: artifacts/*
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}