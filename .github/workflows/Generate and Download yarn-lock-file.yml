name: 获取 yarn.lock

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: yarn install

      - name: 上传 yarn.lock 文件
        uses: actions/upload-artifact@v4
        with:
          name: lockfile
          path: yarn.lock
